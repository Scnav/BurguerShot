<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rust Skin Watch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>📉 Rust Skin Watch</h1>
<p>Monitore quedas de preço e receba alertas em tempo real</p>

<div class="stats">
<div class="card stat"><h3>Skins</h3><div class="price">2</div></div>
<div class="card stat"><h3>Intervalo</h3><div class="price">1 Min</div></div>
<div class="card stat"><h3>Alertas</h3><div class="price">0</div></div>
<div class="card stat"><h3>Status</h3><div class="price positive">Ativo</div></div>
</div>

<div class="card skin-card">
<div><img src="https://via.placeholder.com/100"></div>
<div>
<h2>Psycho Room Facemask</h2>
<div class="price">R$ 10,04</div>
<div class="negative">▼ -12,4%</div>
</div>
<div>
<button class="btn btn-dark">Histórico</button>
<button class="btn btn-danger">Remover</button>
</div>
</div>

</div>
</body>
</html>
