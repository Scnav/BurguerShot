<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação - MAANAIM</title>
    <link rel="icon" href="Thumb.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        /* CSS Customizado para Swiper - botões dentro da imagem */
        .swiper-container {
            position: relative !important;
        }
        .swiper-button-next, .swiper-button-prev {
            position: absolute !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            width: 40px !important;
            height: 40px !important;
            margin-top: -20px !important;
            background: rgba(0, 0, 0, 0.5) !important;
            border-radius: 50% !important;
            color: white !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 10 !important;
            cursor: pointer !important;
        }
        .swiper-button-next {
            right: 10px !important;
        }
        .swiper-button-prev {
            left: 10px !important;
        }
        .swiper-button-next:after, .swiper-button-prev:after {
            font-size: 18px !important;
            font-weight: bold !important;
        }
        .swiper-pagination {
            position: absolute !important;
            bottom: 10px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 10 !important;
        }
        .swiper-pagination-bullet {
            background: white !important;
            opacity: 0.7 !important;
        }
        .swiper-pagination-bullet-active {
            background: var(--verde-principal) !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body>
    <!-- HEADER (IGUAL AO INDEX) -->
    <header class="header">
        <h1>MAANAIM</h1>
        <p class="header-subtitle">Este é o exército de Deus!</p>
        <nav class="nav">
            <a href="index.html">Início</a>
            <a href="programacao.html">Programação</a>
            <a href="biblia.html" data-aba="biblia">Bíblia</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <!-- CONTEÚDO PROGRAMAÇÃO -->
    <section class="section">
        <div class="hero">
            <h2>Agenda de Cultos e Eventos</h2>
            <p>Conheça todos os nossos encontros semanais e especiais</p>
        </div>

        <!-- CARDS DE PROGRAMAÇÃO - CARREGADOS DINAMICAMENTE -->
        <div id="cultosContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 3rem;">
            <!-- Cultos serão carregados dinamicamente do banco de dados -->
        </div>

        <!-- EVENTOS ESPECIAIS -->
        <div style="margin-top: 4rem; text-align: center;">
            <h3 style="font-size: 2rem; color: var(--verde-principal); margin-bottom: 2rem;">Eventos Especiais</h3>
            <div id="eventosEspeciaisContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
                <!-- Eventos especiais serão carregados dinamicamente -->
            </div>
        </div>
    </section>

    <!-- Modal de Inscrição -->
    <div id="modalInscricao" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="background: white; max-width: 500px; margin: 100px auto; padding: 2rem; border-radius: 20px; text-align: center;">
            <h3 style="color: var(--verde-principal); margin-bottom: 1rem;">Inscrever-se no Evento</h3>
            <p id="eventoTitulo" style="font-weight: 600; margin-bottom: 1.5rem;"></p>
            <form id="formInscricao">
                <input type="hidden" id="eventoId">
                <input type="text" id="inscritoNome" placeholder="Seu nome" required style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 10px;">
                <input type="email" id="inscritoEmail" placeholder="Seu email" style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 10px;">
                <input type="tel" id="inscritoTelefone" placeholder="Seu telefone" style="width: 100%; padding: 1rem; margin-bottom: 1rem; border: 2px solid #ddd; border-radius: 10px;">
                <button type="submit" style="background: var(--verde-principal); color: white; border: none; padding: 1rem 2rem; border-radius: 10px; font-size: 1rem; cursor: pointer; margin-right: 0.5rem;">Confirmar Inscrição</button>
                <button type="button" onclick="fecharModal()" style="background: #ccc; color: #333; border: none; padding: 1rem 2rem; border-radius: 10px; font-size: 1rem; cursor: pointer;">Cancelar</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <style>
        .footer-novo {
            background-color: #166534;
            color: white;
            padding: 2rem;
        }
        .footer-novo .logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .footer-novo .copyright {
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }
        .footer-novo .icones {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .footer-novo .icones a {
            color: white;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s;
            text-decoration: none;
        }
        .footer-novo .icones a:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .footer-novo .icones {
                justify-content: center;
            }
        }
    </style>
    <footer class="footer-novo">
        <div class="logo">MAANAIM</div>
        <div class="copyright">© 2026 - Toda glória a Deus</div>
        <div class="icones">
            <a href="https://www.instagram.com/maanaim_ig" target="_blank" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://linktr.ee/igrejamaanaimrestauracao" target="_blank" title="Linktree">
                <i class="fas fa-link"></i>
            </a>
            <a href="https://www.youtube.com/@IgrejaMaanaimalmtamandare" target="_blank" title="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/script.js?v=23"></script>
</body>
</html>
